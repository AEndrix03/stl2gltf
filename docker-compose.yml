version: "3.8"

services:
  stl2glb-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stl2glb-service
    ports:
      - "${PORT:-9002}:9002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-9002}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # MinIO Configuration
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_USE_SSL=false
      - MINIO_REGION=${MINIO_REGION:-us-east-1}

      # Bucket Configuration
      - MINIO_BUCKET_STL=${MINIO_BUCKET_STL:-stl-files}
      - MINIO_BUCKET_GLB=${MINIO_BUCKET_GLB:-glb-files}

      # Service Limits
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-10}
      - TEMP_DIR=${TEMP_DIR:-/tmp/stl2glb}

      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}

      # Security
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}

      # Cleanup
      - CLEANUP_TEMP_FILES=${CLEANUP_TEMP_FILES:-true}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}

    volumes:
      - temp_storage:/tmp/stl2glb
      - log_storage:/var/log/stl2glb

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: stl2glb-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - stl2glb-service
    restart: unless-stopped
    profiles:
      - with-proxy

    # Resource limits for Nginx
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
        reservations:
          cpus: "0.05"
          memory: 8M

volumes:
  minio_data:
    driver: local
  temp_storage:
    driver: local
  log_storage:
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
